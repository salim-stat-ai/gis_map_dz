name: Build Portable Desktop Edition (Windows / Linux / Single-File HTML)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Self-Contained Portable HTML
        run: npm run build:portable

      - name: Package Portable Cross-Platform ZIP Kit
        run: |
          mkdir -p release-kit/GIS-Map-Desktop-Portable/electron
          cp dist-portable/index.html release-kit/GIS-Map-Desktop-Portable/GIS-Map-Algeria-2030-Portable.html
          cp desktop-portable/Start-GIS-Map-Desktop.bat release-kit/GIS-Map-Desktop-Portable/
          cp desktop-portable/Start-GIS-Map-Desktop.command release-kit/GIS-Map-Desktop-Portable/
          cp desktop-portable/Start-GIS-Map-Desktop.sh release-kit/GIS-Map-Desktop-Portable/
          cp desktop-portable/README.md release-kit/GIS-Map-Desktop-Portable/
          cp desktop-portable/main.cjs release-kit/GIS-Map-Desktop-Portable/electron/
          cp desktop-portable/package.json release-kit/GIS-Map-Desktop-Portable/electron/
          cp dist-portable/index.html release-kit/GIS-Map-Desktop-Portable/electron/GIS-Map-Algeria-2030-Portable.html
          cd release-kit && zip -r ../GIS-Map-Algeria-Desktop-Portable.zip GIS-Map-Desktop-Portable

      - name: Build Electron Portable (Windows .exe & Linux AppImage)
        run: |
          cp dist-portable/index.html desktop-portable/GIS-Map-Algeria-2030-Portable.html
          cd desktop-portable
          npm install
          npx electron-builder --win portable --linux AppImage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gis-map-portable-desktop
          path: |
            dist-portable/index.html
            GIS-Map-Algeria-Desktop-Portable.zip
            desktop-portable/release/*.exe
            desktop-portable/release/*.AppImage

      - name: Publish to GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GIS-Map-Algeria-Desktop-Portable.zip
            desktop-portable/release/*.exe
            desktop-portable/release/*.AppImage
            dist-portable/index.html
